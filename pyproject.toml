[project]
name = "sparc"
version = "0.1.0"
description = "Symmetry- and Property-Aware Regularized Crystal generation"
readme = "README.md"
requires-python = ">=3.10,<3.11"

# Single source of truth for the whole environment. Install with:  uv sync --frozen
# CUDA wheels (torch / PyG extensions / DGL) are routed to their custom indexes via
# [tool.uv.sources] + [[tool.uv.index]] below. Versions are pinned to the validated build.
dependencies = [
    # --- config / orchestration ---
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb",
    "python-dotenv",
    "tqdm",
    "p_tqdm",
    "paramiko",
    "huggingface_hub==1.11.0",
    # --- scientific / numerics ---
    "numpy==1.26.4",
    "scipy==1.15.3",
    "pandas",
    "matplotlib",
    # --- materials stack ---
    "ase==3.26.0",
    "pymatgen==2024.10.29",
    "smact<=3.1.0",
    "pyxtal==1.1.3",
    "e3nn==0.6.0",
    "mendeleev",
    "alignn==2024.12.12",
    "atomate2==0.0.18",
    "mattersim==1.1.2",
    "quacc",
    "mattergen",
    # --- CUDA stack (routed to cu118 indexes via [tool.uv.sources]) ---
    "torch==2.2.1+cu118",
    "torchvision==0.17.1+cu118",
    "torchaudio==2.2.1+cu118",
    "torch_geometric==2.7.0",
    "torch_scatter==2.1.2+pt22cu118",
    "torch_sparse==0.6.18+pt22cu118",
    "torch_cluster==1.6.3+pt22cu118",
    "dgl==2.4.0+cu118",
    "pytorch-lightning==2.0.6",
    # --- build ---
    "setuptools<=80.10.2",
]

[project.scripts]
sparc-train = "main:main"
sparc-prefetch = "utils.assets:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "pipeline*", "rewards*", "memory*", "symmcd*", "utils*"]

# --- uv resolver settings ---
# SPARC is a Linux/CUDA-only project: restrict resolution to Linux so the cu118 wheels
# (no macOS/Windows builds) don't create unsatisfiable resolver splits.
# MatterGen 1.0.3 hard-pins torch==2.4.1, but SPARC is validated on torch 2.2.1+cu118
# (the same combination as the original working environment), so override torch to our pin.
[tool.uv]
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "torch==2.2.1+cu118",
    "torchvision==0.17.1+cu118",
    "torchaudio==2.2.1+cu118",
]

# --- Custom wheel indexes (pip's --extra-index-url / --find-links equivalents) ---
# torch/vision/audio come from the PyTorch cu118 simple index; the PyG extensions and
# DGL come from their flat (find-links) HTML pages. `explicit = true` means a package is
# only drawn from that index when routed there by [tool.uv.sources] below.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pyg-cu118"
url = "https://data.pyg.org/whl/torch-2.2.1+cu118.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "dgl-cu118"
url = "https://data.dgl.ai/wheels/torch-2.2/cu118/repo.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
torch_scatter = { index = "pyg-cu118" }
torch_sparse = { index = "pyg-cu118" }
torch_cluster = { index = "pyg-cu118" }
dgl = { index = "dgl-cu118" }
mattergen = { git = "https://github.com/microsoft/mattergen.git", tag = "v1.0.3" }
