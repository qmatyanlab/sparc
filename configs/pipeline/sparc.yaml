_target_: pipeline.sparc.SPARC
rl_epoch: ${rl_epoch}
device: ${device}

save_dir: ./
save_freq: 100

sample_cfg: ${sample_cfg}

topk_ratio: 0.5

replay: True
replay_args:
  buffer_size: 100
  sample_size: 10
  reward_cutoff: 0.1

div_filter: True
df_args:
  tol: 3
  buff: 6

finetune_cfg:
  batch_size: ${eval_size}
  accum_steps: 50
  epochs: 3
  sigma: 0.025
  sigma_decay_steps: .inf
  lr_decay: 1.0
  advantage_mode: centered
  # --- unstable hard-negative penalty (off by default => legacy behavior) ---
  # advantage_baseline: how the centered-advantage baseline is computed.
  #   min    = legacy: min(ltm_baseline, batch_min) -> every advantage >= 0 (reinforce-only)
  #   mean   = batch mean -> floored hard negatives get a NEGATIVE advantage (push-away)
  #   median = batch median
  advantage_baseline: min
  # number of unstable structures (tagged by filter.penalize_unstable) to append to the
  # finetune batch as hard negatives. 0 => none appended (inert).
  n_hard_negatives: 0
  # reward assigned to the appended hard negatives (hard floor).
  unstable_floor: 0.0
