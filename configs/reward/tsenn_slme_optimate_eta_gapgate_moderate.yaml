# SLME eta GATED by band gap (conjunctive AND), E3NN gap throughout.
#
# FoM = min( eta_term , g_gap )   (reduce: min)
#   eta_term : TSENNSLME task=eta, ascending 0->0.35  (the SLME objective; eg_mode=e3nn so
#              the SLME integration lower bound is the E3NN gap, consistent with the gate)
#   g_gap    : E3NNBandGap, ascending ramp minv=0.3 maxv=1.0 (HARD zero below 0.3 eV)
#
# WHY this instead of the weighted-sum e3nngap run (55008527, which COLLAPSED):
#  - That run used 0.2*band_gap(ascending[0.5,3.0]) + 0.8*eta. With the E3NN gap (lower scale
#    than ALIGNN), ~66% of generated structures sit at gap<0.3 eV. The weighted sum still gave
#    them ~0.11-0.19 reward (eta floor), so their advantage was only mildly negative -> the
#    policy CAMPED there (gap mass <0.3 grew 66%->75% over training; reward flat ~0.28).
#  - min() with a HARD-ZERO gate gives gap<0.3 structures EXACTLY 0 -> strongly negative
#    advantage -> they get expelled. Proven on the sibling dielectric runs: gapgate_moderate
#    55018082 (gate 0.3/1.0) drove gap mass <0.3 from 34%->16% and reward up. Do NOT add a
#    near-0 ramp floor (e.g. minv=0): any minor reward in the 0-0.3 pile re-creates the camp.
#  - The 25% of structures already at gap>=1.0 (even early) bootstrap the gate; the gate binds
#    up to ~0.85 eV (forces escape), then eta (peaks ~1.3 eV) does the fine targeting above.
#
# Band gap via the softplus-OFF E3NNBandGap (NOT the TSENN gap head, which floors to ~0.69 eV).
# jsc/voc are dropped (reduce: min requires commensurate terms); eta is the objective and the
# jsc/voc diagnostics are derivable post-hoc if needed.
_target_: rewards.reward.Reward

root_dir: rewards
reduce: min

prop_cfg:
  - name: tsenn_slme_optimate_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      eta_backend: pymatgen
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35

  - name: band_gap
    calculator:
      _target_: rewards.calculators.E3NNBandGap
      root_dir: rewards/bandgap
      task: band_gap
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      device: ${device}
      batch_size: 256
      silent: true
    target: ascending
    minv: 0.3
    maxv: 1.0

reward_threshold: 0.5
