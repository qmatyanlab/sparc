_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: band_gap
    calculator:
      _target_: rewards.calculators.ALIGNN
      root_dir: rewards/bandgap
      task: band_gap
      device: ${device}
      silent: true
    target: ascending
    minv: 0.5
    maxv: 3.0
    weight: 0.4

  - name: tsenn_slme_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_tensor_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_tensor_spectra.yaml
      device: ${device}
      integration_lower_bound: band_gap
      integration_energy_max: 20.0
      thickness_um: 0.1
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35
    weight: 0.6

  - name: tsenn_slme_jsc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_jsc
      task: jsc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_tensor_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_tensor_spectra.yaml
      device: ${device}
      integration_lower_bound: band_gap
      integration_energy_max: 20.0
      thickness_um: 0.1
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 350.0
    weight: 0.0

  - name: tsenn_slme_voc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_voc
      task: voc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_tensor_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_tensor_spectra.yaml
      device: ${device}
      integration_lower_bound: band_gap
      integration_energy_max: 20.0
      thickness_um: 0.1
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 2.5
    weight: 0.0

reward_threshold: 0.5
reduce: weight
