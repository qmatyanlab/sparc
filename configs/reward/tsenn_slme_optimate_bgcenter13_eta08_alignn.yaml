# ALIGNN-GAP variant of tsenn_slme_optimate_bgcenter13_eta08_e3nngap.yaml. Identical reward (bgcenter13
# hard-zero tent @1.3 eV on band_gap w=0.2, ascending eta w=0.8, reduce:weight) EXCEPT the band-gap
# surrogate is swapped E3NN -> ALIGNN in the two WEIGHTED places the gap is consumed:
#   (a) the standalone band_gap tent term  -> calculator rewards.calculators.ALIGNN
#   (b) the SLME eta integration lower bound -> eg_mode: alignn
# ALIGNN uses jarvis's generic MP-trained mp_bandgap_hf (repo jwchen25/MatInvent, cached under .hf_cache),
# a model INDEPENDENT of the project's own E3NN optuna_bandgap regressor. PURPOSE: the E3NN gap had a
# training-data mismatch that steered SLME toward Mn-F chemistry; this run tests what species family an
# independent gap model converges to. jsc/voc are weight-0 (inert) so they stay on eg_mode:e3nn to avoid
# wasted per-structure ALIGNN cost. NOTE ALIGNN loads from a HARDCODED HF repo -> the launcher must export
# HF_HUB_OFFLINE=1 AND HF_HOME=<repo>/.hf_cache. See tsenn_slme_optimate_bgcenter13_eta08_e3nngap.yaml for
# the E3NN counterpart (kept untouched so a retrained E3NN model can drop into the same harness).
_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: band_gap
    calculator:
      _target_: rewards.calculators.ALIGNN
      root_dir: rewards/bandgap
      task: band_gap
      device: ${device}
      silent: true
    # hard-zero tent @1.3 eV: score = (1.0 - |BG-1.3|)/1.0, clamped [0,1]
    # -> 0 below 0.3 eV & above 2.3 eV; peak 1.0 at 1.3 eV
    target: 1.3
    minv: 0.0
    maxv: 1.0
    weight: 0.2

  - name: tsenn_slme_optimate_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: alignn            # <- swapped from e3nn; the SLME gap onset now uses ALIGNN mp_bandgap_hf
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch  # inert under eg_mode:alignn
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml  # inert under eg_mode:alignn
      eta_backend: pymatgen
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35
    weight: 0.8

  - name: tsenn_slme_optimate_jsc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_jsc
      task: jsc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn              # inert (weight 0); kept on e3nn to avoid wasted per-structure ALIGNN cost
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 350.0
    weight: 0.0

  - name: tsenn_slme_optimate_voc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_voc
      task: voc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn              # inert (weight 0)
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 2.5
    weight: 0.0

reward_threshold: 0.5
reduce: weight
