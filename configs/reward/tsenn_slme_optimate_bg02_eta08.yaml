# Ascending SLME reward, eta-reweighted: band_gap 0.2 + eta 0.8 (vs optimate 0.4/0.6).
# Keeps the ASCENDING band_gap term [0.5,3.0] (the corner-escape engine) but shifts
# weight to eta to sharpen targeting at ~1.25 eV and shrink the wide-gap overshoot.
#
# WHY ascending (not centered/eta_heavy): the finetune uses baseline=min(top-k) +
# centered advantage, which subtracts the absolute corner reward — so centering the
# band_gap term (eta_heavy / Scheme E,F) does NOT fix the band_gap->0 collapse
# (verified: tent allocates top-k advantage ~like eta_heavy, which collapsed).
# Ascending rewards the whole [0.5,3.0], so every gap-opening structure carries
# advantage and pulls OUT of the metal corner; eta does the 1.25 eV targeting.
# Weight sweep on run 54218097 (scripts/compare_ascending_weights.py): 0.2/0.8 keeps
# 79% of top-k advantage on escaped structures (vs 83% at 0.4/0.6) while raising
# target[1,1.5] reward 0.555->0.640 and cutting wide-gap(>2eV) reward 0.489->0.377.
#
# Identical to tsenn_slme_optimate.yaml EXCEPT band_gap weight 0.4->0.2,
# eta weight 0.6->0.8, and thickness_um 0.1->0.3 (matches the 03um run line).
_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: band_gap
    calculator:
      _target_: rewards.calculators.ALIGNN
      root_dir: rewards/bandgap
      task: band_gap
      device: ${device}
      silent: true
    target: ascending
    minv: 0.5
    maxv: 3.0
    weight: 0.2

  - name: tsenn_slme_optimate_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.yaml
      device: ${device}
      batch_size: 64
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eta_backend: pymatgen
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35
    weight: 0.8

  - name: tsenn_slme_optimate_jsc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_jsc
      task: jsc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.yaml
      device: ${device}
      batch_size: 64
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 350.0
    weight: 0.0

  - name: tsenn_slme_optimate_voc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_voc
      task: voc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.yaml
      device: ${device}
      batch_size: 64
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 2.5
    weight: 0.0

reward_threshold: 0.5
reduce: weight
