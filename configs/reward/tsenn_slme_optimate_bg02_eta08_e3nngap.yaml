_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: band_gap
    calculator:
      _target_: rewards.calculators.E3NNBandGap
      root_dir: rewards/bandgap
      task: band_gap
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      device: ${device}
      batch_size: 256
      silent: true
    target: ascending
    minv: 0.5
    maxv: 3.0
    weight: 0.2

  - name: tsenn_slme_optimate_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.yaml
      device: ${device}
      batch_size: 64
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      eta_backend: pymatgen
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35
    weight: 0.8

  - name: tsenn_slme_optimate_jsc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_jsc
      task: jsc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.yaml
      device: ${device}
      batch_size: 64
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 350.0
    weight: 0.0

  - name: tsenn_slme_optimate_voc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_voc
      task: voc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.yaml
      device: ${device}
      batch_size: 64
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 2.5
    weight: 0.0

reward_threshold: 0.5
reduce: weight
