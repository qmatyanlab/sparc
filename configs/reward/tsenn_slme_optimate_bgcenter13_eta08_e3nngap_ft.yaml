# FINE-TUNED variant of tsenn_slme_optimate_bgcenter13_eta08_e3nngap.yaml.
# Identical in every way EXCEPT the E3NN band-gap checkpoint: all four gap
# references (the standalone band_gap term's model_path AND the eg_model_path of
# the eta/jsc/voc SLME terms) point at the active-learning model soup
# (TSENN_bandgap_ft_soup.torch = weight-average of the 5 fine-tuned seeds),
# which corrects the OOD/reward-hacking gap errors (OOD MAE 0.78->0.51 eV;
# MAE vs QE on the verification set 1.13->0.52 eV). Spectra surrogate unchanged
# (attribution showed it is not the error source). See active_learning/.
_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: band_gap
    calculator:
      _target_: rewards.calculators.E3NNBandGap
      root_dir: rewards/bandgap
      task: band_gap
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap_ft_soup.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      device: ${device}
      batch_size: 256
      silent: true
    target: 1.3
    minv: 0.0
    maxv: 1.0
    weight: 0.2

  - name: tsenn_slme_optimate_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap_ft_soup.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      eta_backend: pymatgen
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35
    weight: 0.8

  - name: tsenn_slme_optimate_jsc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_jsc
      task: jsc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap_ft_soup.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 350.0
    weight: 0.0

  - name: tsenn_slme_optimate_voc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_voc
      task: voc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap_ft_soup.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 2.5
    weight: 0.0

reward_threshold: 0.5
reduce: weight
