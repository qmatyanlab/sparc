# BAND-GAP-LOCALIZING variant of tsenn_slme_optimate_bg02_eta08_e3nngap.yaml: the band_gap term is a
# HARD-ZERO TENT centered at 1.3 eV (the Shockley-Queisser PV optimum) instead of ascending -- to
# strengthen the claim that SPARC localizes the gap at ~1.3 eV while eta (weight 0.8) maximizes efficiency.
# score = clamp01((1.0 - |BG-1.3|)/1.0): 0 below 0.3 eV (hard-zero -> expels metallic corner via negative
# advantage) & above 2.3 eV; linear escape ramp 0.3->1.3; localization falloff 1.3->2.3. This keeps a
# low-side escape gradient AND zeroes the metallic corner -- the two properties the collapsed 54218097 tent
# (maxv=1.5, partial credit at gap 0) lacked. Everything else (E3NN gap, eta, reduce:weight) is unchanged.
#
# Same as tsenn_slme_optimate_bg02_eta08.yaml but the band gap is the project's own
# E3NN regressor (optuna_bandgap_trial_2) instead of ALIGNN -- in BOTH places ALIGNN
# was used: the standalone band_gap reward AND the SLME integration lower bound
# (eg_mode: e3nn). The E3NN model is loaded through the softplus-OFF Network
# (utils_model_scalar) by rewards.calculators.E3NNBandGap; do NOT route it through the
# TSENN Network, whose softplus-on-0e floors predictions to ~0.69 eV.
_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: band_gap
    calculator:
      _target_: rewards.calculators.E3NNBandGap
      root_dir: rewards/bandgap
      task: band_gap
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      device: ${device}
      batch_size: 256
      silent: true
    # hard-zero tent @1.3 eV: score = (1.0 - |BG-1.3|)/1.0, clamped [0,1]
    # -> 0 below 0.3 eV & above 2.3 eV; peak 1.0 at 1.3 eV (was ascending 0.5->3.0)
    target: 1.3
    minv: 0.0
    maxv: 1.0
    weight: 0.2

  - name: tsenn_slme_optimate_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      eta_backend: pymatgen
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35
    weight: 0.8

  - name: tsenn_slme_optimate_jsc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_jsc
      task: jsc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 350.0
    weight: 0.0

  - name: tsenn_slme_optimate_voc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_voc
      task: voc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eg_mode: e3nn
      eg_model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      eg_config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 2.5
    weight: 0.0

reward_threshold: 0.5
reduce: weight
