# Scheme F: OptiMate SLME reward, eta-heavy, with a band-gap LOW-GAP FLOOR.
# Fixes the band_gap->0 collapse seen in tsenn_slme_optimate_eta_heavy (Scheme E,
# run 54218097): centering at 1.25 with maxv=1.5 gave a zero-gap metal partial
# credit (1.5-1.25)/1.5 = 0.167, rewarding the degenerate near-metallic corner.
#
# Fix: narrow the centered window to maxv=0.75 so the band_gap term is a
# symmetric tent that is EXACTLY ZERO at and below 0.5 eV (1.25 - 0.75) and at
# and above 2.0 eV (1.25 + 0.75), peaking at 1.25 eV. This is config-native
# (rewards/reward.py linear_target, no code change) and starves BOTH failure
# corners: the metallic BG->0 corner AND the wide-gap BG->3 overshoot where
# SLME -> 0 (the ascending-band-gap flaw). Verified on run 54218097's data
# (scripts/compare_slme_reward_schemes.py): reward at BG<0.5 drops 0.064->0.028
# while target [1.0,1.5] stays 0.75; contrast ratio target/corner = 27x
# (vs 12x for Scheme E, 26x for ascending).
#
# Identical to tsenn_slme_optimate_eta_heavy.yaml EXCEPT band_gap maxv 1.5 -> 0.75.
_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: band_gap
    calculator:
      _target_: rewards.calculators.ALIGNN
      root_dir: rewards/bandgap
      task: band_gap
      device: ${device}
      silent: true
    target: 1.25
    minv: 0.0
    maxv: 0.75
    weight: 0.2

  - name: tsenn_slme_optimate_eta
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_eta
      task: eta
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      eta_backend: pymatgen
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 0.35
    weight: 0.8

  - name: tsenn_slme_optimate_jsc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_jsc
      task: jsc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 350.0
    weight: 0.0

  - name: tsenn_slme_optimate_voc
    calculator:
      _target_: rewards.calculators.TSENNSLME
      root_dir: rewards/tsenn_slme_optimate_voc
      task: voc
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_dielectric_spectra.torch
      device: ${device}
      batch_size: 64
      r_max: 6.0
      out_dim: 201
      em_dim: 128
      lmax: 2
      layers: 4
      mul: 64
      num_neighbors: 38.85585538243254
      scale_0e: 7.948065
      dropout_prob: 0.4
      use_batch_norm: false
      output_mode: trace
      energy_min: 0.0
      energy_max: 20.0
      integration_lower_bound: band_gap
      thickness_um: 0.3
      temperature_k: 300.0
      radiative_fraction: 1.0
      voltage_points: 2000
    target: ascending
    minv: 0.0
    maxv: 2.5
    weight: 0.0

reward_threshold: 0.5
reduce: weight
