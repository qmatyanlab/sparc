# Layered-uniaxial dielectric Figure of Merit GATED by band gap — MODERATE gate variant.
#
# Sibling of fom_layered_uniaxial_gapgate_min.yaml; IDENTICAL except the band_gap gate ramp
# is MODERATE (minv=0.3, maxv=1.0, midpoint ~0.65 eV) instead of conservative (0.5/1.2).
# Run in parallel as a hedge: if the conservative gate is too harsh (reward collapses near 0
# because the generator can't reach gaps > ~0.85 eV), the moderate gate keeps a gradient by
# rewarding clearly-gapped small-gap semiconductors while still zeroing true metals (gap<0.3).
#
# FoM = min( d_aniso , g_gap )   (reduce: min = conjunctive AND)
#   d_aniso : TSENNStaticDielectric (layered_uniaxial), ascending 0->0.20 (verbatim from run 54584243)
#   g_gap   : E3NNBandGap, ascending ramp minv=0.3 / maxv=1.0
# Band gap via the softplus-OFF E3NNBandGap (E3NN optuna_bandgap; NOT the TSENN gap head).
_target_: rewards.reward.Reward

root_dir: rewards
reduce: min

prop_cfg:
  - name: tsenn_static_dielectric_layered_uniaxial
    calculator:
      _target_: rewards.calculators.TSENNStaticDielectric
      root_dir: rewards/tsenn_static_dielectric_layered_uniaxial
      task: static_dielectric
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_static_dielectric_tensor.torch
      device: ${device}
      batch_size: 16
      r_max: 6.0
      out_dim: 1
      em_dim: 64
      lmax: 2
      layers: 2
      mul: 32
      num_neighbors: 59.902574690065045
      scale_0e: 8.20143833581954
      scale_2e: 0.6969301341467804
      dropout_prob: 0.4
      use_batch_norm: false
      scalar_mode: layered_uniaxial
      standardize_structure: refined
      standardize_symprec: 0.01
    target: ascending
    minv: 0.0
    maxv: 0.20

  - name: band_gap
    calculator:
      _target_: rewards.calculators.E3NNBandGap
      root_dir: rewards/bandgap
      task: band_gap
      model_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.torch
      config_path: ${hydra:runtime.cwd}/data/surrogates/TSENN_bandgap.yaml
      device: ${device}
      batch_size: 256
      silent: true
    target: ascending
    minv: 0.3
    maxv: 1.0

reward_threshold: 0.5
