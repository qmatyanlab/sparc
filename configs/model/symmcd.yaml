_target_: models.suite.SymmCDSuite

model_name: symmcd
device: ${device}
model_path: null

sample_cfg:
  # batch_size: ${calc:'${eval_size} * 12'}
  batch_size: 256
  num_batches: ${sample_cfg.num_batches}
  dataset: mp          # "mp" for mp_20, "carbon", "perov"
  generation_batch_size: 128
  step_lr: 5e-6
  restrict_spacegroups: []  # e.g. [1, 2, 225] to restrict SG sampling
  sg_temperature: 1.0       # >1 flattens SG distribution (more diversity/P1); 1.0 = mp_20 empirical
  # When true, the RL fine-tune re-noises the representative/asymmetric-unit set M' (what the
  # reverse-diffusion sampler acts on) instead of the orbit-expanded cell M. Reward/relax/filters
  # keep using the expanded structure. Default true = validated-correct behavior (better reward/yield
  # across static, SLME, dielectric A/B); set false to reproduce legacy pre-fix runs.
  finetune_on_representative: true
  # t=0 Wyckoff snap / orbit expansion. Per-axis site-symmetry labels can resolve to a lower-
  # symmetry Wyckoff position than the one the atom converged to; the expansion then stacks
  # coincident images. orbit_merge_tol (Angstrom, 0 = off) merges them back onto the higher-
  # symmetry site, cartesian_snap picks the snap target by Cartesian distance, and strict_snap
  # drops crystals whose snap fails instead of keeping an unexpanded atom.
  # Legacy (pre-fix) behaviour: orbit_merge_tol=0, cartesian_snap=false, strict_snap=false,
  # min_interatomic_distance=0.
  orbit_merge_tol: 0.5
  cartesian_snap: true
  strict_snap: true
  # Reject expanded cells with any interatomic distance below this (Angstrom; 0 = off).
  min_interatomic_distance: 0.5

finetune_cfg:
  batch_size: ${eval_size}
  timesteps: 1000
  lr: 0.0001
  accum_steps: 50
  sigma: 0.025         # KL regularisation weight
  optimize_site_symm: true
